<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Pember Research</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css" />
  <style>
    :root {
      --primary: #7F1D1D;
      --accent: #CA8A04;
      --bg: #FFFBF5;
      --text: #1C1917;
      --surface: #FFFFFF;
      --muted: #78716C;
      --border: #E7E5E4;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; }
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; max-width: 420px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .login-box h1 { font-size: 1.5rem; margin: 0 0 0.5rem; color: var(--primary); }
    .login-box p { color: var(--muted); margin: 0 0 1.5rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 0.35rem; }
    input[type="text"], input[type="password"], input[type="url"], input[type="email"], select, textarea { width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 1rem; background: var(--surface); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--accent); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: var(--radius); font-weight: 600; cursor: pointer; font-size: 1rem; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--primary); }
    .btn-danger { background: #B91C1C; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
    .error { color: #B91C1C; margin-top: 0.75rem; font-size: 0.9rem; }
    .success { color: #15803D; margin-top: 0.75rem; font-size: 0.9rem; }
    .app { display: none; min-height: 100vh; }
    .topbar { background: var(--primary); color: #fff; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 1.1rem; margin: 0; }
    .topbar button { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 0.35rem 0.75rem; border-radius: var(--radius); cursor: pointer; }
    .layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 1rem; }
    .sidebar button { width: 100%; text-align: left; background: transparent; border: none; padding: 0.75rem 1rem; border-radius: var(--radius); cursor: pointer; color: var(--text); font-size: 0.95rem; }
    .sidebar button:hover, .sidebar button.active { background: var(--bg); color: var(--accent); font-weight: 600; }
    .main { flex: 1; padding: 1.5rem; overflow-y: auto; }
    .panel { display: none; max-width: 900px; }
    .panel.active { display: block; }
    .panel h2 { margin-top: 0; color: var(--primary); }
    .form-grid { display: grid; gap: 1rem; margin-top: 1rem; }
    .form-grid.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
    .post-list { list-style: none; padding: 0; margin: 1rem 0 0; }
    .post-list li { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .post-list a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .post-list .actions { display: flex; gap: 0.5rem; }
    .settings-grid { display: grid; gap: 1rem; margin-top: 1rem; }
    .code { font-family: monospace; font-size: 0.85rem; background: var(--bg); padding: 0.5rem; border-radius: var(--radius); word-break: break-all; }
    @media (max-width: 768px) { .layout { flex-direction: column; } .sidebar { width: 100%; } }
  </style>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>Pember Research</h1>
      <p>Admin CMS — sign in to publish research.</p>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter admin password" />
      <button class="btn" style="width:100%;margin-top:1rem;" onclick="login()">Sign In</button>
      <p id="login-error" class="error" style="display:none;"></p>
    </div>
  </div>

  <div id="app" class="app">
    <div class="topbar">
      <h1>Pember Research . Admin</h1>
      <button onclick="logout()">Sign Out</button>
    </div>
    <div class="layout">
      <div class="sidebar">
        <button class="active" onclick="showPanel('new-post', this)">New Post</button>
        <button onclick="showPanel('all-posts', this)">All Posts</button>
        <button onclick="showPanel('settings', this)">Settings</button>
      </div>
      <div class="main">
        <!-- New Post -->
        <div id="new-post" class="panel active">
          <h2>New Post</h2>
          <div class="form-grid two">
            <div><label>Title</label><input type="text" id="post-title" oninput="autoSlug()" /></div>
            <div><label>Slug</label><input type="text" id="post-slug" /><p class="hint">Auto-generated</p></div>
            <div><label>Author</label><input type="text" id="post-author" value="Pember Research Team" /></div>
            <div><label>Category</label>
              <select id="post-category">
                <option>Technology</option><option>Healthcare</option><option>Finance</option>
                <option>Energy</option><option>Real Estate</option><option>Cybersecurity</option>
                <option>ESG</option><option>General</option>
              </select>
            </div>
            <div><label>Date</label><input type="date" id="post-date" /></div>
            <div><label>Tags (comma-separated)</label><input type="text" id="post-tags" /></div>
          </div>
          <div class="form-grid" style="margin-top:1rem;">
            <div><label>Description</label><textarea id="post-description" rows="3"></textarea></div>
            <div><label>Featured Image URL</label><input type="url" id="post-image" /></div>
          </div>
          <div style="margin-top:1.5rem;">
            <label>Article Body (Markdown)</label>
            <textarea id="post-body"></textarea>
          </div>
          <div style="margin-top:1.5rem;display:flex;gap:0.75rem;">
            <button class="btn" onclick="publishPost()">Publish</button>
            <span id="publish-status"></span>
          </div>
        </div>

        <!-- All Posts -->
        <div id="all-posts" class="panel">
          <h2>All Posts</h2>
          <button class="btn btn-secondary btn-sm" onclick="loadPosts()">Refresh</button>
          <ul id="post-list" class="post-list"></ul>
        </div>

        <!-- Settings -->
        <div id="settings" class="panel">
          <h2>Settings</h2>
          <div class="settings-grid">
            <div><label>Repository</label><div class="code">emerilansel-jpg/pember-research</div></div>
            <div><label>Branch</label><div class="code">main</div></div>
            <div><label>Deploy</label><a href="https://github.com/emerilansel-jpg/pember-research/actions" target="_blank">View Build Status →</a></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
  <script>
    const API = 'https://research-api.n311311.workers.dev';
    const REPO = 'emerilansel-jpg/pember-research';
    const BRANCH = 'main';
    let token = localStorage.getItem('admin_token');
    let easyMDE;

    function autoSlug() {
      const title = document.getElementById('post-title').value;
      document.getElementById('post-slug').value = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    async function login() {
      const pw = document.getElementById('password').value;
      const err = document.getElementById('login-error');
      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        const data = await res.json();
        if (data.token) {
          token = data.token;
          localStorage.setItem('admin_token', token);
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app').style.display = 'block';
          initEditor();
        } else { err.textContent = data.error || 'Login failed'; err.style.display = 'block'; }
      } catch { err.textContent = 'Network error'; err.style.display = 'block'; }
    }

    function logout() {
      token = null;
      localStorage.removeItem('admin_token');
      location.reload();
    }

    function showPanel(id, btn) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      if (id === 'all-posts') loadPosts();
    }

    function initEditor() {
      easyMDE = new EasyMDE({ element: document.getElementById('post-body'), spellcheck: false, status: false });
      document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
    }

    async function publishPost() {
      const slug = document.getElementById('post-slug').value;
      if (!slug) return alert('Slug is required');
      const status = document.getElementById('publish-status');
      status.textContent = 'Publishing...';

      const tags = document.getElementById('post-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      const frontmatter = [
        '---',
        `title: "${document.getElementById('post-title').value}"`,
        `date: ${document.getElementById('post-date').value}`,
        `author: "${document.getElementById('post-author').value}"`,
        `category: "${document.getElementById('post-category').value}"`,
        'tags:',
        ...tags.map(t => `  - "${t}"`),
        `description: "${document.getElementById('post-description').value}"`,
      ];
      const image = document.getElementById('post-image').value;
      if (image) frontmatter.push(`featured_image: "${image}"`);
      frontmatter.push('---');

      const content = frontmatter.join('\n') + '\n\n' + easyMDE.value();
      const encoded = btoa(unescape(encodeURIComponent(content)));

      try {
        const res = await fetch(API + '/api/cms/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ repo: REPO, branch: BRANCH, path: `src/content/research/${slug}.md`, content: encoded, message: `Add article: ${slug}` }),
        });
        const data = await res.json();
        if (data.success) { status.innerHTML = '<span class="success">Published! <a href="https://github.com/' + REPO + '/actions" target="_blank">View build →</a></span>'; }
        else { status.innerHTML = '<span class="error">' + (data.error || 'Failed') + '</span>'; }
      } catch { status.innerHTML = '<span class="error">Network error</span>'; }
    }

    async function loadPosts() {
      const list = document.getElementById('post-list');
      list.innerHTML = '<li>Loading...</li>';
      try {
        const res = await fetch(API + '/api/cms/posts?repo=' + REPO + '&branch=' + BRANCH, {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        const data = await res.json();
        if (!data.files) { list.innerHTML = '<li>Failed to load</li>'; return; }
        const mdFiles = data.files.filter(f => f.path.startsWith('src/content/research/') && f.path.endsWith('.md'));
        list.innerHTML = mdFiles.map(f => `
          <li>
            <a href="https://github.com/${REPO}/blob/${BRANCH}/${f.path}" target="_blank">${f.path.split('/').pop()}</a>
            <div class="actions">
              <button class="btn btn-danger btn-sm" onclick="deletePost('${f.path}', '${f.sha}')">Delete</button>
            </div>
          </li>
        `).join('');
      } catch { list.innerHTML = '<li>Network error</li>'; }
    }

    async function deletePost(filePath, sha) {
      if (!confirm('Delete ' + filePath + '?')) return;
      try {
        const res = await fetch(API + '/api/cms/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ repo: REPO, branch: BRANCH, path: filePath, sha, message: 'Delete ' + filePath }),
        });
        const data = await res.json();
        if (data.success) loadPosts();
        else alert(data.error || 'Delete failed');
      } catch { alert('Network error'); }
    }

    if (token) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initEditor();
    }
  </script>
</body>
</html>
